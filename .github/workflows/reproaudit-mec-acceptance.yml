name: ReproAudit MEC manual acceptance

on:
  workflow_dispatch:
    inputs:
      wheel_path:
        description: Absolute path to the prevalidated official wheel on the runner
        required: true
        type: string

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Run official-wheel acceptance
        env:
          REPROAUDIT_WHEEL_PATH: ${{ inputs.wheel_path }}
        run: >-
          python scripts/run_reproaudit_acceptance.py
          --repo-root .
          --wheel "$REPROAUDIT_WHEEL_PATH"
          --output-dir "$RUNNER_TEMP/reproaudit-mec-acceptance"
