<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#40566c"/>
    </marker>
    <style>
      .title { font: 700 22px Arial, sans-serif; fill: #17324d; }
      .layer { font: 700 18px Arial, sans-serif; fill: #17324d; }
      .label { font: 600 14px Arial, sans-serif; fill: #213547; }
      .body { font: 13px Arial, sans-serif; fill: #334e63; }
      .note { font: 12px Arial, sans-serif; fill: #526678; }
      .panel { stroke: #6b7f90; stroke-width: 1.5; rx: 6; }
      .flow { stroke: #40566c; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .candidate { stroke: #6b7f90; stroke-width: 1.6; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" class="title">Three-tier MEC architecture and capacity-feasible task execution</text>
  <text x="600" y="55" text-anchor="middle" class="note">Main scenario: 20 devices, 4 edge servers, and 2 cloud servers</text>

  <rect x="28" y="75" width="350" height="396" class="panel" fill="#eef5fa"/>
  <text x="203" y="103" text-anchor="middle" class="layer">Mobile devices</text>
  <text x="203" y="124" text-anchor="middle" class="body">Tasks originate at source devices</text>

  <g fill="#ffffff" stroke="#2f6f9f" stroke-width="2">
    <rect x="55" y="151" width="45" height="70" rx="7"/>
    <rect x="117" y="151" width="45" height="70" rx="7"/>
    <rect x="179" y="151" width="45" height="70" rx="7"/>
    <rect x="241" y="151" width="45" height="70" rx="7"/>
    <rect x="303" y="151" width="45" height="70" rx="7"/>
    <rect x="55" y="250" width="45" height="70" rx="7"/>
    <rect x="117" y="250" width="45" height="70" rx="7"/>
    <rect x="179" y="250" width="45" height="70" rx="7"/>
    <rect x="241" y="250" width="45" height="70" rx="7"/>
    <rect x="303" y="250" width="45" height="70" rx="7"/>
  </g>
  <g fill="#2f6f9f">
    <circle cx="77.5" cy="208" r="3"/><circle cx="139.5" cy="208" r="3"/>
    <circle cx="201.5" cy="208" r="3"/><circle cx="263.5" cy="208" r="3"/>
    <circle cx="325.5" cy="208" r="3"/><circle cx="77.5" cy="307" r="3"/>
    <circle cx="139.5" cy="307" r="3"/><circle cx="201.5" cy="307" r="3"/>
    <circle cx="263.5" cy="307" r="3"/><circle cx="325.5" cy="307" r="3"/>
  </g>
  <text x="203" y="347" text-anchor="middle" class="note">10 devices shown; cluster represents the remaining devices</text>
  <rect x="58" y="373" width="290" height="68" rx="5" fill="#d8eaf5" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="203" y="398" text-anchor="middle" class="label">Source-device local execution</text>
  <text x="203" y="420" text-anchor="middle" class="body">Local is legal only at the task source</text>

  <rect x="455" y="75" width="292" height="396" class="panel" fill="#eef7f0"/>
  <text x="601" y="103" text-anchor="middle" class="layer">Edge layer</text>
  <text x="601" y="124" text-anchor="middle" class="body">Legal edge candidates</text>
  <g fill="#ffffff" stroke="#3f7f4f" stroke-width="2">
    <rect x="487" y="154" width="92" height="72" rx="5"/>
    <rect x="623" y="154" width="92" height="72" rx="5"/>
    <rect x="487" y="254" width="92" height="72" rx="5"/>
    <rect x="623" y="254" width="92" height="72" rx="5"/>
  </g>
  <g text-anchor="middle" class="label">
    <text x="533" y="184">Edge 1</text><text x="669" y="184">Edge 2</text>
    <text x="533" y="284">Edge 3</text><text x="669" y="284">Edge 4</text>
  </g>
  <g text-anchor="middle" class="note">
    <text x="533" y="207">finite CPU</text><text x="669" y="207">finite CPU</text>
    <text x="533" y="307">finite CPU</text><text x="669" y="307">finite CPU</text>
  </g>
  <rect x="487" y="363" width="228" height="78" rx="5" fill="#dcefe1" stroke="#3f7f4f" stroke-width="1.5"/>
  <text x="601" y="390" text-anchor="middle" class="label">Shared edge CPU capacity</text>
  <text x="601" y="413" text-anchor="middle" class="body">Per-server physical-frequency pool</text>

  <rect x="824" y="75" width="348" height="396" class="panel" fill="#f8f2ea"/>
  <text x="998" y="103" text-anchor="middle" class="layer">Cloud layer</text>
  <text x="998" y="124" text-anchor="middle" class="body">Legal cloud candidates via an edge relay</text>
  <g fill="#ffffff" stroke="#9b6a2f" stroke-width="2">
    <rect x="867" y="175" width="112" height="108" rx="5"/>
    <rect x="1017" y="175" width="112" height="108" rx="5"/>
  </g>
  <g text-anchor="middle" class="label">
    <text x="923" y="214">Cloud 1</text><text x="1073" y="214">Cloud 2</text>
  </g>
  <g text-anchor="middle" class="note">
    <text x="923" y="240">finite CPU</text><text x="1073" y="240">finite CPU</text>
  </g>
  <rect x="867" y="323" width="262" height="77" rx="5" fill="#f0dfca" stroke="#9b6a2f" stroke-width="1.5"/>
  <text x="998" y="350" text-anchor="middle" class="label">Shared cloud CPU capacity</text>
  <text x="998" y="373" text-anchor="middle" class="body">Per-server physical-frequency pool</text>
  <text x="998" y="431" text-anchor="middle" class="body">Deterministic fastest legal relay is evaluated</text>

  <path d="M378 200 C407 190, 425 190, 455 200" class="flow"/>
  <path d="M378 302 C407 292, 425 292, 455 302" class="candidate"/>
  <path d="M747 210 C780 197, 793 197, 824 210" class="flow"/>
  <path d="M747 303 C780 291, 793 291, 824 303" class="candidate"/>
  <text x="416" y="174" text-anchor="middle" class="note">device-edge</text>
  <text x="416" y="188" text-anchor="middle" class="note">uplink</text>
  <text x="785" y="174" text-anchor="middle" class="note">edge-cloud</text>
  <text x="785" y="188" text-anchor="middle" class="note">backhaul</text>

  <rect x="126" y="489" width="948" height="48" rx="5" fill="#edf1f4" stroke="#6b7f90" stroke-width="1.2"/>
  <text x="600" y="510" text-anchor="middle" class="label">Node selection and physical CPU allocation</text>
  <text x="600" y="528" text-anchor="middle" class="note">One legal node and physical CPU allocation per task; bandwidth, power, routing, and queue scheduling are fixed or outside P1.</text>
</svg>
